name: Bora Browser Çoklu Derleyici

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Proje Yapısını Sıfırdan Oluştur
        run: |
          rm -rf package.json package-lock.json node_modules dist
          
          cat << 'EOF' > package.json
          {
            "name": "bora-browser",
            "version": "1.0.0",
            "description": "Bora Browser",
            "main": "main.js",
            "scripts": {
              "pack": "electron-builder --dir",
              "dist": "electron-builder --mac dmg --x64 --publish never"
            },
            "devDependencies": {
              "electron": "^28.2.0",
              "electron-builder": "^24.9.1"
            },
            "build": {
              "appId": "com.bora.browser",
              "productName": "Bora Browser",
              "mac": {
                "category": "public.app-category.productivity",
                "target": ["dmg"],
                "identity": null,
                "minimumSystemVersion": "11.0"
              }
            }
          }
          EOF

          cat << 'EOF' > main.js
          const { app, BrowserWindow } = require('electron');

          function createWindow () {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              title: "Bora Browser",
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            win.loadURL('https://google.com');
          }

          app.whenReady().then(() => {
            createWindow();

            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow();
            });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

      - name: Bağımlılıkları Kur
        run: npm install

      - name: Eksiksiz Paketleme Yap (Intel x64 - Tüm Sürümler)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Hazır Tarayıcıyı GitHub'a Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Bora-Browser-Mac-Full-Support
          path: dist/*.dmg
