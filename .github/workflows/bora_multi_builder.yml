name: Bora Browser Çoklu Derleyici

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Electron ile Bora Browser Paketle
        run: |
          mkdir bora-app && cd bora-app
          npm init -y
          npm install electron electron-builder --save-dev
          
          # Hızlıca bir başlangıç kodu yazalım
          echo 'const { app, BrowserWindow } = require("electron"); app.whenReady().then(() => { const win = new BrowserWindow({ width: 1200, height: 800, title: "Bora Browser" }); win.loadURL("https://google.com"); });' > main.js
          
          # package.json ayarla
          npx json -I -f package.json -e 'this.main="main.js"'
          npx json -I -f package.json -e 'this.scripts={"build":"electron-builder --mac"}'
          
          # Derle
          npm run build

      - name: Tarayıcıyı GitHub'a Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Bora-Browser-Mac-Guncel
          path: bora-app/dist/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4
      - name: Hazırlık
        run: echo "Windows versiyonu"

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4
      - name: Hazırlık
        run: echo "Linux versiyonu"
