name: Bora Browser Çoklu Derleyici

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Chromium Kaynak Kodunu İndir
        run: |
          curl -L -o chromium.tar.gz https://github.com/ungoogled-software/ungoogled-chromium/archive/refs/heads/master.tar.gz
          tar -xzf chromium.tar.gz
          mv ungoogled-chromium-master src

      - name: Markalama ve İsim Değişikliği (Bora Browser)
        run: |
          export LC_ALL=C
          find src/ -type f -exec sed -i '' 's/Chromium/Bora Browser/g' {} +
          find src/ -type f -exec sed -i '' 's/chromium/bora-browser/g' {} +

      - name: Logo Entegrasyonu
        run: |
          if [ -f "icon.png" ]; then
            echo "Özel Bora Browser logosu bulundu, entegre ediliyor..."
            # İleride logoyu sisteme gömecek ekstra komutlar buraya gelecek
          else
            echo "Logo bulunamadı, varsayılan simgeyle devam ediliyor."
          fi

      - name: Sıkıştır ve Paketle (Mac)
        run: |
          mkdir build
          mv src build/Bora_Browser_Mac
          tar -czf Bora_Browser_Mac.tar.gz -C build Bora_Browser_Mac

      - name: Tarayıcıyı GitHub'a Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Bora-Browser-Mac
          path: Bora_Browser_Mac.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Paket Hazırlığı (Windows)
        run: |
          echo "Windows derleme hazırlığı yapılıyor..."
          mkdir build
          echo "Bora Browser Windows Sürümü" > build/readme.txt

      - name: Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Bora-Browser-Windows
          path: build/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Paket Hazırlığı (Linux)
        run: |
          echo "Linux derleme hazırlığı yapılıyor..."
          mkdir build
          echo "Bora Browser Linux Sürümü" > build/readme.txt

      - name: Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Bora-Browser-Linux
          path: build/
